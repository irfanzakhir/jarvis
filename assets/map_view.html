<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>JARVIS Tactical Recon Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body, #map {
            width: 100%; height: 100%; margin: 0; padding: 0;
            background: #040810; overflow: hidden; font-family: 'Consolas', 'Courier New', monospace;
        }
        .leaflet-control-zoom, .leaflet-control-attribution { display: none !important; }

        /* Tactical Tron Dark Vector Layer (Zero Watermarks, 100% Free) */
        .google-vector-dark {
            filter: invert(100%) hue-rotate(180deg) contrast(145%) brightness(95%) saturate(200%);
        }
        
        /* Tactical CRT Scanlines and HUD Vignette */
        #map::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 6px 100%;
            pointer-events: none; z-index: 1000; opacity: 0.6;
        }
        #map::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            box-shadow: inset 0 0 60px rgba(0, 212, 255, 0.35), inset 0 0 15px rgba(0, 255, 170, 0.3);
            z-index: 1001;
        }

        /* Radar Target Crosshair Marker */
        .radar-crosshair {
            width: 70px; height: 70px; border: 1.5px dashed #00d4ff; border-radius: 50%;
            position: absolute; margin-left: -35px; margin-top: -35px;
            animation: pulseRadar 3.5s infinite linear; box-shadow: 0 0 12px rgba(0, 212, 255, 0.4);
            pointer-events: none;
        }
        .radar-center {
            width: 8px; height: 8px; background: #00d4ff; border-radius: 50%;
            position: absolute; margin-left: -4px; margin-top: -4px;
            box-shadow: 0 0 12px #00d4ff, 0 0 20px #00ffaa;
            animation: nodeGlow 1.5s infinite ease-in-out;
        }
        @keyframes pulseRadar {
            0% { transform: rotate(0deg) scale(0.9); opacity: 0.5; }
            50% { transform: rotate(180deg) scale(1.1); opacity: 0.95; }
            100% { transform: rotate(360deg) scale(0.9); opacity: 0.5; }
        }
        @keyframes nodeGlow {
            0%, 100% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; }
        }

        /* POI Marker Pulse */
        .poi-pin {
            width: 24px; height: 24px; border-radius: 50%;
            border: 2px solid #00d4ff; background: rgba(0, 212, 255, 0.3);
            box-shadow: 0 0 10px #00d4ff; display: flex; align-items: center; justify-content: center;
            font-size: 11px; color: #fff; font-weight: bold; cursor: pointer;
            transition: transform 0.2s;
        }
        .poi-pin:hover { transform: scale(1.3); }
        .poi-pin.hospital { border-color: #ff3366; background: rgba(255, 51, 102, 0.35); box-shadow: 0 0 12px #ff3366; }
        .poi-pin.fuel { border-color: #ffaa00; background: rgba(255, 170, 0, 0.35); box-shadow: 0 0 12px #ffaa00; }
        .poi-pin.restaurant { border-color: #00ffaa; background: rgba(0, 255, 170, 0.35); box-shadow: 0 0 12px #00ffaa; }

        /* Tactical Leaflet Popups */
        .leaflet-popup-content-wrapper {
            background: rgba(6, 14, 26, 0.92) !important;
            border: 1px solid #00d4ff !important;
            border-radius: 6px !important;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4) !important;
            color: #e0f4ff !important;
            font-family: 'Consolas', monospace !important;
        }
        .leaflet-popup-tip {
            background: rgba(6, 14, 26, 0.92) !important;
            border: 1px solid #00d4ff !important;
        }
        .tactical-popup h4 { margin: 0 0 4px 0; color: #00d4ff; font-size: 13px; text-transform: uppercase; }
        .tactical-popup p { margin: 2px 0; font-size: 11px; color: #8baac4; }
        .tactical-popup .badge { display: inline-block; padding: 2px 6px; font-size: 9px; background: rgba(0, 212, 255, 0.2); border: 1px solid #00d4ff; border-radius: 3px; color: #00ffaa; margin-top: 4px; }

        /* Route Animation */
        .neon-route {
            stroke: #00d4ff;
            stroke-width: 4;
            stroke-dasharray: 10, 10;
            animation: dash 1.5s linear infinite;
            filter: drop-shadow(0 0 6px #00d4ff);
        }
        @keyframes dash {
            to { stroke-dashoffset: -20; }
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        var map = L.map('map', {
            zoomControl: false,
            attributionControl: false,
            fadeAnimation: true
        }).setView([9.5916, 76.5222], 13);

        // Layers: Google Tron Vector Dark & Google Satellite (Zero API keys, zero watermarks)
        var darkLayer = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            className: 'google-vector-dark'
        }).addTo(map);

        var satLayer = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 20
        });

        var currentBaseLayer = 'dark';
        window.switchMapMode = function(mode) {
            map.removeLayer(darkLayer);
            map.removeLayer(satLayer);
            if (mode === 'sat') {
                satLayer.addTo(map);
                currentBaseLayer = 'sat';
            } else {
                darkLayer.addTo(map);
                currentBaseLayer = 'dark';
            }
        };

        // Center Marker with Radar Pulse
        var radarIcon = L.divIcon({
            className: 'custom-radar-container',
            html: '<div class="radar-crosshair"></div><div class="radar-center"></div>'
        });
        var centerMarker = L.marker([9.5916, 76.5222], { icon: radarIcon }).addTo(map);

        var poiMarkersGroup = L.layerGroup().addTo(map);
        var routePolyline = null;

        // --- PUBLIC JS API ---
        window.flyToSector = function(lat, lon, zoom) {
            centerMarker.setLatLng([lat, lon]);
            map.flyTo([lat, lon], zoom || 14, { duration: 1.5, easeLinearity: 0.25 });
        };

        window.setPOIMarkers = function(poiList) {
            poiMarkersGroup.clearLayers();
            if (!poiList || poiList.length === 0) return;

            var bounds = [];
            poiList.forEach(function(poi, idx) {
                var catClass = poi.category || 'poi';
                var iconSymbol = '📍';
                if (catClass.indexOf('hospital') !== -1) iconSymbol = '🏥';
                else if (catClass.indexOf('fuel') !== -1 || catClass.indexOf('petrol') !== -1) iconSymbol = '⛽';
                else if (catClass.indexOf('restaurant') !== -1) iconSymbol = '🍴';
                else if (catClass.indexOf('police') !== -1) iconSymbol = '🛡️';
                else if (catClass.indexOf('atm') !== -1) iconSymbol = '💳';

                var icon = L.divIcon({
                    className: 'custom-poi-marker',
                    html: '<div class="poi-pin ' + catClass + '">' + iconSymbol + '</div>'
                });

                var m = L.marker([poi.lat, poi.lon], { icon: icon });
                var popupHtml = '<div class="tactical-popup">' +
                    '<h4>' + (poi.name || 'Waypoint') + '</h4>' +
                    '<p>' + (poi.display_name || poi.address || '') + '</p>' +
                    '<span class="badge">' + (poi.distance_km ? poi.distance_km + ' KM AWAY' : 'TACTICAL TARGET') + '</span>' +
                    '</div>';
                m.bindPopup(popupHtml);
                poiMarkersGroup.addLayer(m);
                bounds.push([poi.lat, poi.lon]);
            });

            if (bounds.length > 0) {
                bounds.push(centerMarker.getLatLng());
                map.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
            }
        };

        window.drawRoute = function(coords, distKm, durationMins) {
            if (routePolyline) {
                map.removeLayer(routePolyline);
                routePolyline = null;
            }
            if (!coords || coords.length === 0) return;

            routePolyline = L.polyline(coords, {
                className: 'neon-route',
                color: '#00d4ff',
                weight: 4,
                opacity: 0.9
            }).addTo(map);

            map.fitBounds(routePolyline.getBounds(), { padding: [50, 50] });

            // Popup at destination
            var lastPt = coords[coords.length - 1];
            L.popup({ className: 'tactical-popup' })
                .setLatLng(lastPt)
                .setContent('<div class="tactical-popup"><h4>DESTINATION LOCKED</h4><p>DISTANCE: ' + distKm + ' KM</p><p>EST. TRANSIT: ' + durationMins + ' MINS</p></div>')
                .openOn(map);
        };

        window.clearRoute = function() {
            if (routePolyline) {
                map.removeLayer(routePolyline);
                routePolyline = null;
            }
        };

        window.zoomIn = function() { map.zoomIn(); };
        window.zoomOut = function() { map.zoomOut(); };
        window.resetView = function() { window.flyToSector(9.5916, 76.5222, 13); };

        // Notify ready
        console.log("JARVIS Tactical Map Subsystem Online");
    </script>
</body>
</html>
