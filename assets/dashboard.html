<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Command Center - Core Layer</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00d4ff;
            --neon-dim: rgba(0, 212, 255, 0.2);
            --bg-dark: #050508;
            --panel-bg: rgba(0, 10, 20, 0.6); /* Made slightly more transparent to act as a background */
        }

        body.combat-mode {
            --neon: #ff003c;
            --neon-dim: rgba(255, 0, 60, 0.2);
            --bg-dark: #0a0000;
            --panel-bg: rgba(20, 0, 0, 0.6);
        }

        body {
            margin: 0; overflow: hidden; background-color: transparent;
            font-family: 'Share Tech Mono', monospace; color: var(--neon);
            height: 100vh; width: 100vw;
            transition: all 0.5s ease;
            position: relative; /* Switch to absolute positioning for a freeform HUD */
        }

        /* THE ANIMATED VITALS GRAPH */
        .panel {
            background: var(--panel-bg); border: 1px solid var(--neon-dim);
            position: absolute; padding: 15px; display: flex; flex-direction: column;
            transition: all 0.4s ease-out; box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            width: 300px;
            bottom: 40px; /* Anchored to bottom right */
            right: 40px;
        }

        .panel::before, .panel::after {
            content: ''; position: absolute; width: 15px; height: 15px; border: 2px solid var(--neon); transition: all 0.3s;
        }
        .panel::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .panel::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        .panel-header {
            font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 2px;
            border-bottom: 1px solid var(--neon-dim); padding-bottom: 5px; margin-bottom: 10px;
            display: flex; justify-content: space-between; flex-shrink: 0;
        }

        body.combat-mode .panel { box-shadow: 0 0 10px rgba(255, 0, 60, 0.5); border-color: var(--neon); }

        .graph-container { width: 100%; height: 60px; margin-top: 5px; border-bottom: 1px solid var(--neon-dim); border-left: 1px solid var(--neon-dim); }

        /* THE CENTER REACTOR CORE */
        .center-core {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%); /* Perfectly centers the reactor */
            display: flex; justify-content: center; align-items: center; 
            z-index: -1; /* Pushes the reactor behind everything */
        }
        
        .reactor-container {
            position: absolute; width: 450px; height: 450px; /* Scaled up slightly for visual impact */
            display: flex; justify-content: center; align-items: center;
            contain: strict; isolation: isolate; 
        }
        
        .ring { position: absolute; border-radius: 50%; box-sizing: border-box; will-change: transform; transform-origin: center center; }
        .ring-1 { width: 440px; height: 440px; border: 2px solid var(--neon-dim); border-top: 2px solid var(--neon); animation: spin 10s linear infinite; }
        .ring-2 { width: 420px; height: 420px; border: 4px dashed var(--neon); animation: spin-reverse 15s linear infinite; opacity: 0.7; }
        .ring-3 { width: 380px; height: 380px; border: 2px dotted var(--neon); animation: spin 8s linear infinite; }
        .ring-4 { width: 350px; height: 350px; border: 1px solid var(--neon-dim); border-bottom: 4px solid var(--neon); animation: spin-reverse 5s linear infinite; }
        
        body.combat-mode .ring-1 { animation-duration: 4s; }
        body.combat-mode .ring-2 { animation-duration: 6s; }
        body.combat-mode .ring-3 { animation-duration: 3s; }
        body.combat-mode .ring-4 { animation-duration: 2s; }

        .core-text {
            font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 42px; letter-spacing: 12px;
            color: var(--neon); text-shadow: 0 0 20px var(--neon); 
            z-index: 10; position: relative; text-align: center;
            opacity: 0.8;
        }

        /* THE GLOBAL DEEP SEARCH OVERLAY */
        .news-overlay {
            position: absolute; top: -100%; left: 50%; width: 800px; max-width: 90vw; height: 65vh;
            background: rgba(0, 5, 10, 0.98); border: 2px solid var(--neon);
            box-shadow: 0 0 50px rgba(0,0,0,1), 0 0 30px var(--neon-dim); z-index: 9999;
            display: flex; flex-direction: column; padding: 30px;
            will-change: top, transform; transform: translateX(-50%) translate3d(0,0,0);
            transition: top 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .news-overlay.active { top: 15vh; }
        .overlay-header { font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 900; letter-spacing: 5px; border-bottom: 2px solid var(--neon); padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; }
        .overlay-content { flex: 1; overflow-y: auto; font-size: 16px; line-height: 1.8; -ms-overflow-style: none; scrollbar-width: none; }
        .overlay-content::-webkit-scrollbar { display: none; }
        .news-overlay::before, .news-overlay::after { content: ''; position: absolute; width: 30px; height: 30px; border: 3px solid var(--neon); }
        .news-overlay::before { top: -3px; left: -3px; border-right: none; border-bottom: none; }
        .news-overlay::after { bottom: -3px; right: -3px; border-left: none; border-top: none; }
        body.combat-mode .news-overlay { border-color: var(--neon); box-shadow: 0 0 50px rgba(0,0,0,1), 0 0 30px rgba(255,0,60,0.5); background: rgba(10, 0, 0, 0.98);}

        @keyframes spin { 0% { transform: translate3d(0,0,0) rotate(0deg); } 100% { transform: translate3d(0,0,0) rotate(360deg); } }
        @keyframes spin-reverse { 0% { transform: translate3d(0,0,0) rotate(0deg); } 100% { transform: translate3d(0,0,0) rotate(-360deg); } }
    </style>
</head>
<body>

    <div class="center-core">
        <div class="reactor-container">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="ring ring-3"></div>
            <div class="ring ring-4"></div>
        </div>
        <div class="core-text">J.A.R.V.I.S</div>
    </div>

    <div class="panel" id="vitals">
        <div class="panel-header"><span>SYSTEM VITALS</span><span>RAW</span></div>
        <div style="margin-top:5px;">CPU CORE LOAD: <span id="cpu-text">0</span>%<canvas id="cpu-canvas" class="graph-container" width="270" height="60"></canvas></div>
        <div style="margin-top:10px;">PHYSICAL RAM: <span id="ram-text">0</span>%<canvas id="ram-canvas" class="graph-container" width="270" height="60"></canvas></div>
    </div>

    <div class="news-overlay" id="news-overlay">
        <div class="overlay-header"><span>GLOBAL INTEL DECRYPTED</span><span style="font-size: 16px; display: flex; align-items: center;">LIVE FEED</span></div>
        <div class="overlay-content" id="overlay-text">PROCESSING DATA ARCHIVES...</div>
    </div>

<script>
    window.dataPoints = 50;
    window.cpuHistory = new Array(window.dataPoints).fill(0);
    window.ramHistory = new Array(window.dataPoints).fill(0);

    window.drawGraph = function(canvasId, historyArray, color) {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const w = canvas.width, h = canvas.height;
        ctx.clearRect(0, 0, w, h);
        ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 2;
        const step = w / (window.dataPoints - 1);
        for (let i = 0; i < window.dataPoints; i++) {
            const x = i * step; const y = h - (historyArray[i] / 100 * h);
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke(); ctx.lineTo(w, h); ctx.lineTo(0, h);
        ctx.fillStyle = color.startsWith('#') ? color + '33' : color; ctx.fill();
    };

    window.updateVitals = function(cpu, ram) {
        window.cpuHistory.push(cpu); window.cpuHistory.shift();
        window.ramHistory.push(ram); window.ramHistory.shift();
        document.getElementById('cpu-text').innerText = cpu; 
        document.getElementById('ram-text').innerText = ram;
        const color = document.body.classList.contains('combat-mode') ? '#ff003c' : '#00d4ff';
        window.drawGraph('cpu-canvas', window.cpuHistory, color);
        window.drawGraph('ram-canvas', window.ramHistory, color);
    };

    window.activatePanel = function(panelId, content = null) {
        if (panelId === 'news') {
            const overlay = document.getElementById('news-overlay');
            if (content) {
                let cleanContent = content.replace("[JARVIS]: ", "").replace(/\\n/g, '<br><br>').replace(/\n/g, '<br><br>');
                document.getElementById('overlay-text').innerHTML = cleanContent;
            }
            overlay.classList.add('active');
            setTimeout(() => { overlay.classList.remove('active'); }, 60000); 
        }
    };

    // Keep this function active to dismiss the news overlay when you speak!
    window.updateComms = function(status) {
        if (status.includes("[USER]:")) { 
            document.getElementById('news-overlay').classList.remove('active'); 
        }
    };

    // Cleaned up setCombatMode to only affect the body background colors
    window.setCombatMode = function(state) {
        if (state) {
            document.body.classList.add('combat-mode');
        } else {
            document.body.classList.remove('combat-mode');
        }
    };
    
    // We completely removed updateWifi() because the Python layer handles it now!
</script>
</body>
</html>
